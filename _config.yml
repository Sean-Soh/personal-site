# Site settings. Edit these first.
title: Sean Soh
tagline: Notes on building, learning and working together.
description: Sean Soh's personal site. Thoughts, knowledge sharing and collaboration opportunities.
url: "https://www.seansoh.com"
baseurl: ""

author:
  name: Sean Soh
  role_line: "Technical Art Director · Full-Stack Technical Artist · Pipeline Architect"   # small line above the headline
  email: sean@seansoh.com

# Main navigation (order matters)
nav:
  - title: Home
    url: /
  - title: Writing
    url: /writing/
  - title: Projects
    url: /projects/
  - title: Resources
    url: /resources/
  - title: About
    url: /about/
  - title: Work with me
    url: /work-with-me/

permalink: /writing/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  resources:
    output: true
    permalink: /resources/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: resources }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
